name: ReproCheck project audit
description: Audit research claims, metrics, split leakage, and provenance from reprocheck.json.
author: Dulat Nurlanuly

branding:
  icon: check-circle
  color: green

inputs:
  manifest:
    description: Project manifest path, relative to the repository root.
    required: false
    default: reprocheck.json
  output-dir:
    description: Directory for child reports and the linked batch certificate.
    required: false
    default: outputs/reprocheck
  python-version:
    description: Python version used to run ReproCheck.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ReproCheck
      shell: bash
      run: >-
        python -m pip install
        -c "$GITHUB_ACTION_PATH/requirements-ci.txt"
        "$GITHUB_ACTION_PATH"
    - name: Audit project
      shell: bash
      run: >-
        reprocheck check
        "${{ inputs.manifest }}"
        --output-dir "${{ inputs.output-dir }}"
