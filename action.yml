name: ReproCheck project audit
description: Audit research claims, metrics, split leakage, and provenance from reprocheck.json.
author: Dulat Nurlanuly

branding:
  icon: check-circle
  color: green

inputs:
  manifest:
    description: Project manifest path, relative to the repository root.
    required: false
    default: reprocheck.json
  output-dir:
    description: Directory for child reports and the linked batch certificate.
    required: false
    default: outputs/reprocheck
  python-version:
    description: Python version used to run ReproCheck.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ReproCheck
      shell: bash
      run: >-
        python -m pip install
        -c "$GITHUB_ACTION_PATH/requirements-ci.txt"
        "$GITHUB_ACTION_PATH"
    - name: Audit project
      shell: bash
      env:
        REPROCHECK_MANIFEST: ${{ inputs.manifest }}
        REPROCHECK_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: >-
        reprocheck check
        "$REPROCHECK_MANIFEST"
        --output-dir "$REPROCHECK_OUTPUT_DIR"
