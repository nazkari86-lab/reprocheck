name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -c requirements-ci.txt -e '.[dev]'
      - run: python -m pytest

  quality:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements-ci.txt -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pyright src tests
      - run: python -m pytest --cov=src/reprocheck --cov-report=term-missing --cov-fail-under=97

  action-smoke:
    name: Reusable action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          manifest: examples/action/reprocheck.json
          output-dir: outputs/action-smoke
      - run: >-
          reprocheck verify
          --certificate outputs/action-smoke/batch-certificate.json
          --artifact-dir examples/action

  reproducibility:
    name: Full scientific gate
    needs: [test, quality, action-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements-ci.txt -e '.[dev]'
      - run: make gate
      - name: Store deterministic package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reprocheck-packages
          path: dist/*
          if-no-files-found: error
