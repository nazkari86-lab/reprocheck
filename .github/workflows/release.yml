name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: make install
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(python -c 'from reprocheck.version import __version__; print(__version__)')
          test "$GITHUB_REF_NAME" = "v$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - run: make gate
      - run: make dependency-audit
      - name: Generate CycloneDX SBOM
        run: make runtime-sbom
      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum \
            "reprocheck-${PACKAGE_VERSION}-py3-none-any.whl" \
            "reprocheck-${PACKAGE_VERSION}.tar.gz" \
            reprocheck-sbom.cdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/reprocheck-${{ env.PACKAGE_VERSION }}-py3-none-any.whl
            dist/reprocheck-${{ env.PACKAGE_VERSION }}.tar.gz
            dist/reprocheck-sbom.cdx.json
            dist/SHA256SUMS
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/reprocheck-${PACKAGE_VERSION}-py3-none-any.whl"
          "dist/reprocheck-${PACKAGE_VERSION}.tar.gz"
          dist/reprocheck-sbom.cdx.json
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "ReproCheck $GITHUB_REF_NAME"
